services:
  backend:
    build: .
    image: food-cms-backend:latest
    ports:
      - "4015:4015"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "4015"
      UPLOADS_DIR: /uploads
    volumes:
      - uploads_data:/uploads
    restart: unless-stopped

volumes:
  uploads_data:
