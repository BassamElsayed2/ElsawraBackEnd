services:
  backend:
    build: .
    image: food-cms-backend:latest
    ports:
      - "4015:4015"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "4015"
      UPLOADS_DIR: /app/uploads
    volumes:
      # Local/dev named volume. On Coolify use UI Persistent Storage (Bind Mount):
      #   Source: /data/elsawra/uploads  →  Destination: /app/uploads
      - uploads_data:/app/uploads
    restart: unless-stopped

volumes:
  uploads_data:
